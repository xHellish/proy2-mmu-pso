<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MMU Simulator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Pantalla de preparacion -->
    <section id="setup_screen">
      <h1>MMU Simulator</h1>
      <form id="setup_form">
        <label>Seed <input id="seed_input" type="number" value="1" /></label>
        <label>Algorithm <select id="algorithm_select"></select></label>
        <label>Processes (P) <select id="process_count_select"></select></label>
        <label>Operations (N) <select id="operation_count_select"></select></label>
        <label>Operations file <input id="file_input" type="file" accept=".txt" /></label>
        <button id="download_button" type="button">Download file</button>
        <button id="start_button" type="submit">Start</button>
      </form>
    </section>

    <!-- Pantalla de simulacion -->
    <section id="simulation_screen" hidden>
      <div id="controls"></div>
      <div id="panel_opt"></div>
      <div id="panel_selected"></div>
    </section>

    <script type="module" src="main.js"></script>
  </body>
</html>
